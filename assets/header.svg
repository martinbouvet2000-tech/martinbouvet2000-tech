<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0883e"/>
      <stop offset=".5" stop-color="#ffa657"/>
      <stop offset="1" stop-color="#f0883e"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <clipPath id="type"><rect x="80" y="170" width="900" height="40">
      <animate attributeName="width" values="0;0;900" keyTimes="0;0.2;1" dur="3s" fill="freeze"/>
    </rect></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
    .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    @keyframes blink{50%{opacity:0}} .cur{animation:blink 1s step-end infinite}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .rise{animation:rise .8s ease-out both}
  </style>
  <rect width="1200" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="14" fill="url(#grid)" opacity=".6"/>
  <circle cx="1050" cy="60" r="140" fill="#f0883e" opacity=".06"/>
  <circle cx="1120" cy="230" r="90" fill="#7ee787" opacity=".05"/>

  <text x="80" y="72" class="mono rise" font-size="16" fill="#7ee787">~/martin $ whoami</text>
  <text x="78" y="138" class="sans rise" font-size="60" font-weight="800" fill="#f0f6fc" style="animation-delay:.2s">Martin Bouvet</text>
  <text x="80" y="198" class="mono" font-size="24" fill="url(#ink)" clip-path="url(#type)">Builder × Business × AI — I ship products with agents.</text>
  <rect x="826" y="178" width="12" height="26" fill="#f0883e" class="cur">
    <animate attributeName="x" values="80;80;826" keyTimes="0;0.2;1" dur="3s" fill="freeze"/>
  </rect>
  <text x="80" y="232" class="mono" font-size="14" fill="#6e7681">emlyon business student · generative &amp; agentic AI @ oxford · lyon, fr</text>
</svg>
