<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Martin Bouvet — Builder × Business × AI. A neural network feeding a chip.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="55%" stop-color="#11161d"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0883e"/>
      <stop offset=".5" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#f0883e"/>
      <animate attributeName="x1" values="-1;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0" stop-color="#f0883e" stop-opacity=".30"/>
      <stop offset="1" stop-color="#f0883e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1b2129" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="type"><rect x="72" y="196" width="760" height="34">
      <animate attributeName="width" values="0;0;760" keyTimes="0;.18;1" dur="3.2s" fill="freeze"/>
    </rect></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    @keyframes blink{50%{opacity:0}} .cur{animation:blink 1.1s step-end infinite}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
    @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
    .node{animation:breathe 4s ease-in-out infinite}
  </style>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" opacity=".7"/>
  <circle cx="985" cy="150" r="190" fill="url(#glow)"/>

  <!-- neural net feeding a chip -->
  <g stroke="#2a3038" stroke-width="1.2" fill="none">
    <path d="M830 70 L920 110 M830 70 L920 150 M830 150 L920 110 M830 150 L920 190 M830 230 L920 150 M830 230 L920 190"/>
    <path d="M920 110 L1000 150 M920 150 L1000 150 M920 190 L1000 150"/>
  </g>
  <g fill="#f0883e">
    <circle class="node" cx="830" cy="70" r="5" style="animation-delay:0s"/>
    <circle class="node" cx="830" cy="150" r="5" style="animation-delay:.5s"/>
    <circle class="node" cx="830" cy="230" r="5" style="animation-delay:1s"/>
    <circle class="node" cx="920" cy="110" r="5" style="animation-delay:1.5s"/>
    <circle class="node" cx="920" cy="150" r="5" style="animation-delay:2s"/>
    <circle class="node" cx="920" cy="190" r="5" style="animation-delay:2.5s"/>
  </g>
  <g fill="#ffb066">
    <circle r="3.5" filter="url(#soft)">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M830 70 L920 110 L1000 150"/>
    </circle>
    <circle r="3.5" filter="url(#soft)">
      <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" path="M830 230 L920 190 L1000 150"/>
    </circle>
    <circle r="3.5" filter="url(#soft)">
      <animateMotion dur="2.6s" begin="1.7s" repeatCount="indefinite" path="M830 150 L920 150 L1000 150"/>
    </circle>
  </g>

  <g>
    <g stroke="#f0883e" stroke-width="2" stroke-linecap="round">
      <path d="M1000 130h-14 M1000 150h-14 M1000 170h-14 M1112 130h14 M1112 150h14 M1112 170h14"/>
      <path d="M1030 100v-14 M1056 100v-14 M1082 100v-14 M1030 200v14 M1056 200v14 M1082 200v14"/>
    </g>
    <rect x="1000" y="100" width="112" height="100" rx="14" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
    <rect x="1016" y="116" width="80" height="68" rx="8" fill="none" stroke="#3a2a1c" stroke-width="1.5"/>
    <text x="1056" y="160" text-anchor="middle" class="mono" font-size="26" font-weight="700" fill="#f0883e">MB</text>
    <rect x="1000" y="100" width="112" height="100" rx="14" fill="none" stroke="#ffb066" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;.9;0" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="72" y="84" class="mono rise" font-size="15" fill="#7ee787">~/martin $ whoami</text>
  <text x="70" y="160" class="sans rise" font-size="62" font-weight="800" fill="#f0f6fc" style="animation-delay:.15s">Martin Bouvet</text>
  <text x="72" y="222" class="mono" font-size="25" fill="url(#ink)" clip-path="url(#type)">Builder × Business × AI — I ship products with agents.</text>
  <rect x="806" y="200" width="11" height="26" fill="#f0883e" class="cur">
    <animate attributeName="x" values="72;72;806" keyTimes="0;.18;1" dur="3.2s" fill="freeze"/>
  </rect>
  <text x="72" y="258" class="mono rise" font-size="14" fill="#6e7681" style="animation-delay:.3s">emlyon business student (Gerland) · generative &amp; agentic AI @ oxford · lyon, fr</text>
</svg>
