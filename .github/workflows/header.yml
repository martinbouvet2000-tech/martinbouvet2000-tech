name: header

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_header.py
      - scripts/build_nightly.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_header.py
      # Redraw the terminal from the committed counters. It can't invent a new
      # night — the agent runs on my laptop — but it keeps the "no run for N
      # days" line honest while the laptop is off.
      - name: Redraw last night
        run: python scripts/build_nightly.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/header.svg assets/nightly.svg
          git diff --cached --quiet || git commit -m "chore: refresh the header" && git push
